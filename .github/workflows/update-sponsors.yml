name: Update sponsors

on:
  schedule:
    - cron: '0 0 * * *' # every day at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write # commit the updated sponsors.json
  actions: write # start the deploy workflow

concurrency:
  group: update-sponsors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Fetch sponsors from GitHub
        run: node scripts/update-sponsors.mjs
        env:
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
          # Defaults to the repo owner; set a repository variable to override.
          SPONSORS_LOGIN: ${{ vars.SPONSORS_LOGIN || github.repository_owner }}

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- src/data/sponsors.json; then
            echo "No sponsor changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sponsors.json
          git commit -m "chore: update sponsors"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows,
      # so start the deploy explicitly when the list changed.
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
